name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: compliance }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/compliance
      JWT_SECRET: test-only-secret-with-at-least-32-characters
      RUN_DB_TESTS: 'true'
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && python -m pip_audit -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: ALLOW_SCHEMA_MIGRATION=1 ./start.sh migrate
      - run: docker build -t compliance-backend . && docker build -t compliance-frontend ./frontend
      - run: ./start.sh check
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: ALLOW_SCHEMA_MIGRATION=1 ./start.sh migrate
